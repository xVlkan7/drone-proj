services:
  ros:
    build: .

    volumes:
      - ../:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:/root/.Xauthority:ro
      
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - QT_X11_NO_MITSHM=1

    ipc: host

    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true

    working_dir: /workspace